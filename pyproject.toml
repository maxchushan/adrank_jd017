[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maxchushan-adrank_jd017"
version = "0.1.0"
description = "从样本里推断广告召回与排序工程师·标注一致性与标注者偏差应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "maxchushan" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://maxchushan.github.io"
Repository = "https://github.com/maxchushan/adrank_jd017"
Issues = "https://github.com/maxchushan/adrank_jd017/issues"

[project.scripts]
adrank_jd017 = "adrank_jd017:main"

[tool.setuptools]
py-modules = ["adrank_jd017"]
